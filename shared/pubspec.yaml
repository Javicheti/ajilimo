name: ajilimo_shared
description: "AjíLimo — design system, widgets y modelos compartidos."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.0

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-400.ttf
          weight: 400
        - asset: assets/fonts/Jost-500.ttf
          weight: 500
        - asset: assets/fonts/Jost-600.ttf
          weight: 600
        - asset: assets/fonts/Jost-700.ttf
          weight: 700
